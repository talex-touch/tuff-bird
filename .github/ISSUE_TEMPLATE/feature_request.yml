name: Feature request
description: Something the logger or the board should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The training workflow this is for, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you would like it to work. TensorBoard, Weights & Biases or another tool that does it well is a useful reference.
