name: Bug report
description: Something in the logger or the board does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest script or command that shows it. Attach the event file if the board shows it wrong.
      render: python
  - type: input
    id: version
    attributes:
      label: tuff-bird version
      placeholder: python -c "import tuffbird; print(tuffbird.__version__)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, OS and browser
      placeholder: Python 3.12, Ubuntu 24.04 over SSH, Chrome 141
  - type: textarea
    id: log
    attributes:
      label: Board log
      description: The contents of <logdir>/.tuffbird/board.log, if the board is involved.
      render: text
